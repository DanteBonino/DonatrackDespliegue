services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: donatrack
      POSTGRES_USER: donatrack
      POSTGRES_PASSWORD: ${DONATRACK_DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donatrack -d donatrack"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  donaciones:
    build: { context: ., target: donaciones }
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DONATRACK_DB_URL: jdbc:postgresql://db:5432/donatrack?currentSchema=donaciones
      DONATRACK_DB_USER: donatrack
      LOGISTICA_SERVICE_URL: ${URL_PUBLICA_LOGISTICA}
      DONATRACK_FOTOS_DIR: /app/uploads/fotos   # nuevo: obligatoria para la app
      JAVA_TOOL_OPTIONS: -Xmx384m
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - fotos:/app/uploads/fotos                # nuevo: sobrevive a up --build y redeploys
    ports: ["80:7070"]
    restart: unless-stopped

  logistica:
    build: { context: ., target: logistica }
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DONATRACK_DB_URL: jdbc:postgresql://db:5432/donatrack?currentSchema=logistica
      DONATRACK_DB_USER: donatrack
      DONACIONES_SERVICE_URL: http://donaciones:7070
      PLANIFICADOR_EXTERNO_URL: http://planificador-externo-de-rutas.com/planificar
      DEPOSITO_DIRECCION: "Av. Medrano 951, CABA, Argentina"
      DEPOSITO_LATITUD: "-34.59855526311623"
      DEPOSITO_LONGITUD: "-58.42013582713193"
      JAVA_TOOL_OPTIONS: -Xmx384m
      TZ: America/Argentina/Buenos_Aires
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  dbdata:
  fotos:                                        # nuevo