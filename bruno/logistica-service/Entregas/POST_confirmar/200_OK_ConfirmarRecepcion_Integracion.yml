info:
  name: 200 OK - Confirmar Recepcion (Trigger Integración)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrlLogistica}}/entregas/ENT-001/confirmar"

  body:
    type: json
    data: |-
      {
        "comprobante": "foto_recepcion_ok.jpg"
      }

  auth: inherit

  runtime:
    scripts:
      - type: tests
        code: |-
          test("should return 200 OK", function() {
              expect(res.status).to.equal(200);
          });
          test("should return success message", function() {
              expect(res.body.mensaje).to.contain("Recepción confirmada");
          });

  settings:
    encodeUrl: true